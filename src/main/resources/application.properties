spring.application.name=Url-Shortener

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/Url-Shortener
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Explicitly define dialect to prevent metadata errors if DB connection fails
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection Pool - tuned for high-concurrency redirect workload
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000

# JWT
jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-1234567890}
jwt.expiration-ms=86400000
