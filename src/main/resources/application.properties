spring.application.name=Url-Shortener

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Explicitly define dialect to prevent metadata errors if DB connection fails
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection Pool - tuned for high-concurrency redirect workload
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000

# JWT — no default value; JWT_SECRET env var MUST be set (Base64-encoded, min 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Click count flush interval (ms) - 5 minutes
click-count.flush-interval-ms=300000

# URL cache TTL (seconds) - 30 minutes
url-cache.ttl-seconds=1800

# Analytics event batching
analytics.batch-size=500
analytics.flush-interval-ms=5000

# Actuator — only expose health and info endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# SpringDoc — only document /api/** paths (excludes the public redirect endpoint)
springdoc.paths-to-match=/api/**