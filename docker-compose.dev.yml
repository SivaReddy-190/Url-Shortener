# =============================================
# URL Shortener — Local Development (Full Stack)
# =============================================
# Runs ALL services including the frontend container.
# Usage: docker-compose -f docker-compose.dev.yml up -d --build
# =============================================

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: urlshortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-Url-Shortener}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Url-Shortener}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & Click Buffer
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-Url-Shortener}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-wfGQlBlRrHXuu5sJxYcYUnLgP7TF4zTGYLst8WlTtII=}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # React Frontend (Nginx Reverse Proxy)
  # ==========================================
  frontend:
    build:
      context: ../URL-Shortener-Frontend
      dockerfile: Dockerfile
    container_name: urlshortener-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - app-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-net:
    driver: bridge
